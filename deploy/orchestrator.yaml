port: 8080
db_path: /data/orchestrator.db

# The orchestrator's externally reachable base URL. Used to build links back
# to tickets — for example the "Golem wrote a spec for this issue" milestone
# comments ghsync posts to GitHub. Leaving this empty produces working syncs
# but broken links (a bare "/tickets/<id>" with no host), so set it to the
# real address before enabling GitHub sync in production.
base_url: "https://golem.example.com"

# tls:
#   cert: /etc/golem/tls/cert.pem
#   key:  /etc/golem/tls/key.pem

github:
  token_env: GOLEM_GITHUB_TOKEN
  poll_interval: 15m
  drain_interval: 20s
  manual_sync_cooldown: 60s
  api_base: ""          # set for GitHub Enterprise
