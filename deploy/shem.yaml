orchestrator: http://orchestrator:8080
name: shem-local
# api_key is set via GOLEM_SHEM_API_KEY env var — no need to edit this file.
# To set it here instead: docker compose run orchestrator shems add --name default

# no_push: true routes git push to the local repo instead of a remote.
# Ideal for local testing — the ticket branch is visible via git log --all
# in the mounted repo volume without any network call.
#
# It stays true in the shipped stack deliberately, even though the GitHub
# integration's draft pull request needs a real push. Two reasons, both about
# this file's own defaults rather than about the feature:
#
#   1. The first repo below is local://test, which has no remote at all. A
#      push there can never succeed.
#   2. The second is mounted from GOLEM_REPO_PATH, which DEFAULTS TO THE
#      CURRENT DIRECTORY. Shipping no_push: false would mean the very first
#      ticket anyone runs from the quick start pushes a branch to whatever
#      remote their working copy happens to point at.
#
# Pushing is load-bearing in both flows: the shem merges an epic child into
# its run's integration branch itself, and a standalone ticket's branch is
# what the GitHub add-on opens a pull request from. So set no_push: false
# and make sure the shem can authenticate: set GOLEM_SHEM_PUSH_TOKEN in .env
# (the entrypoint installs it as an HTTPS credential helper for any remote;
# GOLEM_SHEM_GITHUB_TOKEN is the older github.com-scoped name), or give the
# container your own SSH key. Without one of those the push fails: a
# standalone ticket still reaches ready-for-review and simply gets no pull
# request, but an epic child cannot integrate at all.
#
# GOLEM_SHEM_PUSH_TOKEN is a different variable from the orchestrator's
# GOLEM_GITHUB_TOKEN on purpose, and it is empty by default. This container
# runs the agent on issue text a stranger can write, so it is handed a
# repository credential only when someone has decided it needs one. A separate
# token is better than reusing the orchestrator's.
#
# Note that a PRIVATE repository needs a credential even while no_push stays
# true: the shem clones the repository itself the first time it works a
# ticket for it. Pre-cloning the repository onto the host and mounting it is
# the way to keep this container credential-free.
#
# Turned on, with a token set: the shem pushes the ticket branch once the
# work reaches ready-for-review and reports that to the orchestrator. For a
# standalone ticket the GitHub add-on queues the pull request — all three of
# issue_number, branch_pushed and phase=ready-for-review must hold first
# (api.enqueuePRIfReady), so nothing is opened for a web-form ticket or for
# work that never pushed. For an epic child the same shem takes the merge
# lane: gate check, merge into the run's target ref, receipt.
no_push: false
max_concurrent: 5
# Per-repo recovery defaults on. Under a repos entry, set auto_retry: false
# to opt out, or attention_fix_attempts: 3 to set its lifetime dispatch cap.
# The diagnose model is selected with backend.stage_defaults like other stages.

repos:
  # Golem repo — mounted at /repos/golem via GOLEM_REPO_PATH in docker-compose.
  - path: /repos/golem
    remote: https://github.com/LeonP92/golem

# backend: declares the adapter this shem runs, how to invoke it, and the model
# catalog it reports to the orchestrator. Absent, as here, it means claude-code
# with its default catalog: haiku, sonnet and opus, and a default tier per stage.
# A block without models keeps the default models and overrides only the keys
# it sets, so `supports_selection: false` alone turns selection off. Unknown
# keys stop the shem at startup.
#
# Other adapters (codex, opencode) need their CLI in the image and their auth
# in .env, and are selected by GOLEM_BACKEND there — no block is needed here
# unless you override models or settings; an explicit adapter: that disagrees
# with GOLEM_BACKEND stops the shem at startup. See README "Backends". For
# example:
#
# backend:
#   adapter: codex             # default catalog: gpt-5.6-terra/sol/luna
#
# backend:
#   adapter: opencode          # OpenAI-compatible provider from .env.example
#   tiers: [small]
#   models:
#     - {id: ollama/kimi-k2.7-code, label: "Kimi K2.7 Code", tier: small}
#   stage_defaults: {brainstorm: small, plan: small, implement: small, revise: small, validate: small, observe: small, review: small, pr-description: small, graph: small, epic-plan: small}
#
# `golem models list --config /etc/golem/shem.yaml` prints what this shem will
# report; `golem models probe` with the same flag prints a block holding only
# the models that answered, to paste here. probe never edits this file.
#
# backend:
#   adapter: claude-code        # registered adapter name
#   command: claude             # binary; the adapter's default when empty
#   extra_args: ["--add-dir", "/opt/toolchains"]   # after the adapter's own args
#   env:                        # extra env for the agent process (not GOLEM_*)
#     ANTHROPIC_BASE_URL: "..."
#   supports_selection: true    # whether the backend accepts a per-call model
#   tiers: [small, medium, large]   # operator labels, cheapest first
#   models:
#     - {id: haiku,  label: "Haiku",  tier: small}
#     - {id: sonnet, label: "Sonnet", tier: medium}
#     - {id: opus,   label: "Opus",   tier: large}
#   stage_defaults:             # the tier each stage falls back to
#     brainstorm: large
#     plan: large
#     implement: medium

# Optional on each repos entry: worktree_setup: ["npm ci"], setup_timeout: 5m.
# Use synthetic fixtures, never copy live .env. See docs/shem-safety-and-setup.md.
