name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
            cc: gcc
          - goos: linux
            goarch: arm64
            runner: ubuntu-latest
            cc: aarch64-linux-gnu-gcc
            apt: gcc-aarch64-linux-gnu
          - goos: darwin
            goarch: amd64
            runner: macos-15-intel
            cc: clang
          - goos: darwin
            goarch: arm64
            runner: macos-14
            cc: clang
          - goos: windows
            goarch: amd64
            runner: windows-latest
            cc: gcc
            ext: .exe

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install cross-compiler (Linux arm64 only)
        if: matrix.apt != ''
        run: sudo apt-get install -y ${{ matrix.apt }}

      - name: Install mingw (Windows only)
        if: matrix.goos == 'windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          install: mingw-w64-x86_64-gcc

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
          CC: ${{ matrix.cc }}
        run: go build -trimpath -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o "dist/golem_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.ext }}" ./cmd/golem

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: golem_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist/
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true

  # Container images publish alongside the binaries: one orchestrator image
  # and one shem image with every supported agent CLI installed — the runtime
  # backend is GOLEM_BACKEND at container start, never baked in, so one image
  # serves any configuration. Both land in GHCR under the repository owner,
  # tagged with the release version.
  #
  # The packages publish PRIVATE (GitHub's default for a first push, whatever
  # the repository's visibility) and each inherits the repository's access
  # permissions via the OCI source label below. Making a package public is a
  # one-time, irreversible per-package choice for the maintainer in its
  # settings; until then pulls need a PAT with read:packages.
  docker:
    name: Publish images
    # Tags run no other CI: do not publish images for a ref whose binaries do not build.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout, and ls-remote for the latest check below
      packages: write # push to GHCR
      id-token: write # keyless image signing (cosign, OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # docker/metadata-action already keeps prereleases off `latest`, but it
      # would still move `latest` for a hotfix tag on an OLDER release line
      # (docker/metadata-action#80). So `latest` moves only when the pushed
      # tag is the highest stable semver tag on the remote — which this push
      # just updated. sort -V, not lexicographic: v0.0.10 sorts above v0.0.9.
      - name: Check whether this tag is the latest stable release
        id: latest
        # The ref name is attacker-shaped text (a tag can contain $ and backticks): pass it as data, never splice it into the script.
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          highest="$(git ls-remote --tags origin 'v*' | grep -v '\^{}' | cut -d/ -f3 | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)"
          echo "highest stable tag: ${highest:-none}; this release: $REF_NAME"
          if [ "$REF_NAME" = "$highest" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
          fi

      # GHCR namespaces are lowercase; the owner login is not.
      - name: Lowercase the repository owner for the GHCR namespace
        id: ghcr
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Beyond tags, the metadata action emits the standard OCI labels —
      # org.opencontainers.image.source among them — which links each package
      # to this repository on first push, so the images show on the repo page
      # and inherit its access permissions.
      - name: Image tags (orchestrator)
        id: meta-orchestrator
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ steps.ghcr.outputs.owner }}/golem-orchestrator
          tags: type=semver,pattern=v{{version}}
          flavor: latest=${{ steps.latest.outputs.is_latest }}

      - name: Image tags (shem)
        id: meta-shem
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ steps.ghcr.outputs.owner }}/golem-shem
          tags: type=semver,pattern=v{{version}}
          flavor: latest=${{ steps.latest.outputs.is_latest }}

      - name: Build and push the orchestrator image
        id: build-orchestrator
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: orchestrator
          platforms: linux/amd64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta-orchestrator.outputs.tags }}
          labels: ${{ steps.meta-orchestrator.outputs.labels }}
          cache-from: type=gha,scope=orchestrator
          cache-to: type=gha,mode=max,scope=orchestrator
          provenance: mode=max
          sbom: true

      # VERSION keeps `golem version` inside the image in step with the
      # release's binaries. GOLEM_BACKENDS is overridden to every supported
      # CLI: a pulled image cannot take build args, and the runtime picks its
      # backend through GOLEM_BACKEND.
      - name: Build and push the shem image
        id: build-shem
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: shem
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
            GOLEM_BACKENDS=claude-code codex opencode
          tags: ${{ steps.meta-shem.outputs.tags }}
          labels: ${{ steps.meta-shem.outputs.labels }}
          cache-from: type=gha,scope=shem
          cache-to: type=gha,mode=max,scope=shem
          provenance: mode=max
          sbom: true

      # Sign each image by digest (keyless: the workflow identity is the signer), so a
      # consumer can `cosign verify` that it came from this repository's release workflow.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the images
        env:
          OWNER: ${{ steps.ghcr.outputs.owner }}
          ORCHESTRATOR_DIGEST: ${{ steps.build-orchestrator.outputs.digest }}
          SHEM_DIGEST: ${{ steps.build-shem.outputs.digest }}
        run: |
          set -eu
          cosign sign --yes "ghcr.io/$OWNER/golem-orchestrator@$ORCHESTRATOR_DIGEST"
          cosign sign --yes "ghcr.io/$OWNER/golem-shem@$SHEM_DIGEST"
