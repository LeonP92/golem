{{define "log_entry"}}
<div class="log-entry entry-{{.EntryType}} py-0.5" style="display:grid;grid-template-columns:auto auto auto 1fr;gap:0 0.75rem;align-items:baseline">
  <span class="text-base-content/30 select-none">[{{.SequenceNum}}]</span>
  <span class="font-semibold truncate">{{.EntryType}}</span>
  <span class="text-base-content/50 truncate">{{if .FromRole}}{{.FromRole}}{{end}}{{if and .FromRole .ToRole}} → {{end}}{{if .ToRole}}{{.ToRole}}{{end}}</span>
  <div class="md-content text-base-content break-words min-w-0">{{.Message}}</div>
</div>
{{end}}
