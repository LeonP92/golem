{{define "request_changes_form"}}
<div class="mt-1">
  <p class="text-xs font-medium text-base-content/50 uppercase tracking-wide mb-2">Request Changes</p>
  <form hx-post="/api/tickets/{{.}}/actions"
        hx-on::after-request="if(event.detail.successful) window.location.reload()">
    <input type="hidden" name="action" value="request-changes">
    <textarea name="feedback" rows="4"
              class="textarea textarea-bordered w-full"
              placeholder="Describe what needs to change…"></textarea>
    <button type="submit" class="btn btn-warning btn-sm gap-1.5 mt-2 w-full">
      <span class="iconify" data-icon="heroicons:paper-airplane"></span>
      Send Feedback
    </button>
  </form>
</div>
{{end}}

{{define "action_card"}}
<div class="action-card" id="action-{{.ID}}">
  <p class="text-sm mb-3 text-base-content/80 leading-relaxed">{{.Prompt}}</p>
  {{if eq .Kind "approval"}}
    <div class="flex flex-col gap-3">
      <form hx-post="/api/tickets/{{.TicketID}}/actions"
            hx-vals='{"action":"approve"}'
            hx-on::after-request="if(event.detail.successful) window.location.reload()">
        <button type="submit" class="btn btn-success btn-sm gap-1.5 w-full">
          <span class="iconify" data-icon="heroicons:check-circle"></span>
          Approve
        </button>
      </form>
      <div class="divider my-0 text-xs text-base-content/30">or</div>
      {{template "request_changes_form" .TicketID}}
    </div>
  {{else if eq .Kind "blocker_ack"}}
    <form hx-post="/api/tickets/{{.TicketID}}/actions"
          hx-vals='{"action":"answer","input_id":{{.ID}},"response":"acknowledged"}'
          hx-on::after-request="if(event.detail.successful) window.location.reload()">
      <button type="submit" class="btn btn-warning btn-sm gap-1.5">
        <span class="iconify" data-icon="heroicons:check-circle"></span>
        Acknowledge
      </button>
    </form>
  {{else}}
    <form hx-post="/api/tickets/{{.TicketID}}/actions"
          hx-on::after-request="if(event.detail.successful) window.location.reload()">
      <input type="hidden" name="action" value="answer">
      <input type="hidden" name="input_id" value="{{.ID}}">
      <label class="text-xs font-medium text-base-content/50 uppercase tracking-wide">Your Answer</label>
      <textarea name="response" rows="4"
                class="textarea textarea-bordered w-full mt-1"
                placeholder="Your answer…"></textarea>
      <button type="submit" class="btn btn-primary btn-sm gap-1.5 mt-2 w-full">
        <span class="iconify" data-icon="heroicons:paper-airplane"></span>
        Submit
      </button>
    </form>
  {{end}}
</div>
{{end}}
