{{define "shem_row"}}
<tr>
  <td class="text-sm text-base-content/50">{{.ID}}</td>
  <td class="font-medium">{{.Name}}</td>
  <td>
    {{if eq .Status "online"}}
      <span class="badge badge-success badge-sm gap-1">
        <span class="iconify text-xs" data-icon="heroicons:signal"></span>
        online
      </span>
    {{else}}
      <span class="badge badge-ghost badge-sm gap-1">
        <span class="iconify text-xs" data-icon="heroicons:signal-slash"></span>
        offline
      </span>
    {{end}}
  </td>
  <td>
    {{if .CurrentTicket}}<a href="/tickets/{{.CurrentTicket}}" class="link link-hover">#{{.CurrentTicket}}</a>{{else}}&mdash;{{end}}
  </td>
  <td class="text-sm text-base-content/60">
    {{if .LastHeartbeat}}{{.LastHeartbeat.Format "2006-01-02 15:04:05"}}{{else}}&mdash;{{end}}
  </td>
  <td class="text-xs font-mono text-base-content/50 max-w-xs truncate">{{.Repos}}</td>
</tr>
{{end}}
