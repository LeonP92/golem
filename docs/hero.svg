<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <linearGradient id="accent-v" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <linearGradient id="stone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d333b"/>
      <stop offset="100%" style="stop-color:#21262d"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="eye-glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="340" fill="url(#bg)"/>

  <!-- Subtle dot grid -->
  <g opacity="0.07" fill="#58a6ff">
    <circle cx="50"  cy="50"  r="1"/><circle cx="150" cy="50"  r="1"/><circle cx="250" cy="50"  r="1"/><circle cx="350" cy="50"  r="1"/>
    <circle cx="50"  cy="110" r="1"/><circle cx="150" cy="110" r="1"/><circle cx="250" cy="110" r="1"/><circle cx="350" cy="110" r="1"/>
    <circle cx="50"  cy="170" r="1"/><circle cx="150" cy="170" r="1"/><circle cx="250" cy="170" r="1"/><circle cx="350" cy="170" r="1"/>
    <circle cx="50"  cy="230" r="1"/><circle cx="150" cy="230" r="1"/><circle cx="250" cy="230" r="1"/><circle cx="350" cy="230" r="1"/>
    <circle cx="50"  cy="290" r="1"/><circle cx="150" cy="290" r="1"/><circle cx="250" cy="290" r="1"/><circle cx="350" cy="290" r="1"/>
    <circle cx="850" cy="50"  r="1"/><circle cx="950" cy="50"  r="1"/><circle cx="1050" cy="50"  r="1"/><circle cx="1150" cy="50"  r="1"/>
    <circle cx="850" cy="110" r="1"/><circle cx="950" cy="110" r="1"/><circle cx="1050" cy="110" r="1"/><circle cx="1150" cy="110" r="1"/>
    <circle cx="850" cy="170" r="1"/><circle cx="950" cy="170" r="1"/><circle cx="1050" cy="170" r="1"/><circle cx="1150" cy="170" r="1"/>
    <circle cx="850" cy="230" r="1"/><circle cx="950" cy="230" r="1"/><circle cx="1050" cy="230" r="1"/><circle cx="1150" cy="230" r="1"/>
    <circle cx="850" cy="290" r="1"/><circle cx="950" cy="290" r="1"/><circle cx="1050" cy="290" r="1"/><circle cx="1150" cy="290" r="1"/>
  </g>

  <!-- ═══════════════════════════════════════════════
       LEFT COLUMN  x: 0–390  (orchestrator → shems)
       ═══════════════════════════════════════════════ -->

  <!-- Orchestrator node: x=20, y=144, w=130, h=52  (center y=170) -->
  <g transform="translate(20,144)">
    <rect width="130" height="52" rx="7" fill="url(#stone)" stroke="#30363d" stroke-width="1"/>
    <rect width="130" height="2.5" rx="1.25" fill="url(#accent)" opacity="0.85"/>
    <text x="65" y="24" text-anchor="middle" fill="#e6edf3" font-family="monospace" font-size="11" font-weight="600">orchestrator</text>
    <text x="65" y="40" text-anchor="middle" fill="#6e7681" font-family="monospace" font-size="9">dashboard · SSE · approvals</text>
  </g>

  <!-- Arrows: from (150, 170) to shem left edges at x=248 -->
  <!-- shem-a center y=106, shem-b center y=170, shem-c center y=234 -->
  <g stroke="#6e7681" stroke-width="1.2" opacity="0.5" fill="none">
    <polyline points="150,170 196,106 248,106" stroke-dasharray="4,3"/>
    <polyline points="150,170 248,170"/>
    <polyline points="150,170 196,234 248,234" stroke-dasharray="4,3"/>
  </g>
  <!-- Arrowheads -->
  <polygon points="248,106 240,102 240,110" fill="#6e7681" opacity="0.5"/>
  <polygon points="248,170 240,166 240,174" fill="#6e7681" opacity="0.5"/>
  <polygon points="248,234 240,230 240,238" fill="#6e7681" opacity="0.5"/>

  <!-- Shem nodes: x=248, w=120 → right edge x=368  -->
  <!-- shem-a: y=83 to y=129 -->
  <g transform="translate(248,83)">
    <rect width="120" height="46" rx="6" fill="url(#stone)" stroke="#30363d" stroke-width="1"/>
    <text x="60" y="20" text-anchor="middle" fill="#6e7681" font-family="monospace" font-size="9">shem-a</text>
    <text x="60" y="34" text-anchor="middle" fill="#3fb950" font-family="monospace" font-size="9">● implement</text>
  </g>
  <!-- shem-b: y=147 to y=193 -->
  <g transform="translate(248,147)">
    <rect width="120" height="46" rx="6" fill="url(#stone)" stroke="#30363d" stroke-width="1"/>
    <text x="60" y="20" text-anchor="middle" fill="#6e7681" font-family="monospace" font-size="9">shem-b</text>
    <text x="60" y="34" text-anchor="middle" fill="#d29922" font-family="monospace" font-size="9">● review</text>
  </g>
  <!-- shem-c: y=211 to y=257 -->
  <g transform="translate(248,211)">
    <rect width="120" height="46" rx="6" fill="url(#stone)" stroke="#30363d" stroke-width="1"/>
    <text x="60" y="20" text-anchor="middle" fill="#6e7681" font-family="monospace" font-size="9">shem-c</text>
    <text x="60" y="34" text-anchor="middle" fill="#58a6ff" font-family="monospace" font-size="9">● brainstorm</text>
  </g>

  <!-- Column divider left: x=390 -->
  <line x1="390" y1="30" x2="390" y2="310" stroke="#21262d" stroke-width="1.5"/>

  <!-- ═══════════════════════════════════════════════════
       CENTRE COLUMN  x: 390–810  (avatar + wordmark)
       centre x = 600
       ═══════════════════════════════════════════════════ -->

  <!-- ── Cute golem avatar, all coords absolute, centred at x=600 ── -->

  <!-- Body: x=574 y=152 w=52 h=50 rx=9 -->
  <rect x="574" y="152" width="52" height="50" rx="9" fill="url(#stone)" stroke="#444c56" stroke-width="1.5"/>
  <!-- Body cracks (stone texture) -->
  <path d="M590 162 L587 173 L594 178" stroke="#484f58" stroke-width="0.8" fill="none" opacity="0.7"/>

  <!-- Left arm: x=548 y=157 w=27 h=14 rx=5 -->
  <rect x="548" y="157" width="27" height="14" rx="5" fill="url(#stone)" stroke="#444c56" stroke-width="1.2"/>
  <!-- Right arm: x=625 y=157 w=27 h=14 rx=5 -->
  <rect x="625" y="157" width="27" height="14" rx="5" fill="url(#stone)" stroke="#444c56" stroke-width="1.2"/>

  <!-- Left leg: x=577 y=200 w=18 h=14 rx=4 -->
  <rect x="577" y="200" width="18" height="14" rx="4" fill="url(#stone)" stroke="#444c56" stroke-width="1.2"/>
  <!-- Right leg: x=605 y=200 w=18 h=14 rx=4 -->
  <rect x="605" y="200" width="18" height="14" rx="4" fill="url(#stone)" stroke="#444c56" stroke-width="1.2"/>

  <!-- Head: cx=600 cy=118 r=36 -->
  <circle cx="600" cy="118" r="36" fill="url(#stone)" stroke="#444c56" stroke-width="1.5"/>

  <!-- Ear-bumps (little golem horns): protrude above head -->
  <circle cx="576" cy="89" r="9" fill="url(#stone)" stroke="#444c56" stroke-width="1.2"/>
  <circle cx="624" cy="89" r="9" fill="url(#stone)" stroke="#444c56" stroke-width="1.2"/>

  <!-- Head surface crack -->
  <path d="M610 99 L614 108 L609 113" stroke="#484f58" stroke-width="0.9" fill="none" opacity="0.6"/>

  <!-- Eyes (glowing purple) -->
  <!-- Left eye -->
  <circle cx="589" cy="116" r="7" fill="#0d1117" filter="url(#eye-glow)"/>
  <circle cx="589" cy="116" r="4.5" fill="#7c3aed" filter="url(#eye-glow)"/>
  <circle cx="590.5" cy="114.5" r="1.5" fill="white" opacity="0.55"/>
  <!-- Right eye -->
  <circle cx="611" cy="116" r="7" fill="#0d1117" filter="url(#eye-glow)"/>
  <circle cx="611" cy="116" r="4.5" fill="#7c3aed" filter="url(#eye-glow)"/>
  <circle cx="612.5" cy="114.5" r="1.5" fill="white" opacity="0.55"/>

  <!-- Smile -->
  <path d="M591 130 Q600 137 609 130" stroke="#6e7681" stroke-width="1.8" fill="none" stroke-linecap="round"/>

  <!-- Forehead rune (simple diamond glyph) -->
  <path d="M600 100 L604 105 L600 110 L596 105 Z" fill="none" stroke="#7c3aed" stroke-width="1" opacity="0.7"/>

  <!-- ── Wordmark below avatar (bottom of legs y=214, wordmark y=252) ── -->
  <!-- font-size=68, "golem" ≈ 5×41 = 205px wide, spans x=498–703  ✓ within 390–810 -->
  <text x="600" y="252"
        text-anchor="middle"
        fill="url(#accent)"
        font-family="'SF Mono','Fira Code',monospace"
        font-size="68"
        font-weight="700"
        letter-spacing="-1"
        filter="url(#glow)">golem</text>

  <!-- Tagline: y=278 -->
  <text x="600" y="278"
        text-anchor="middle"
        fill="#6e7681"
        font-family="'SF Mono','Fira Code',monospace"
        font-size="11"
        letter-spacing="1.5">workflow orchestration for AI coding agents</text>

  <!-- Column divider right: x=810 -->
  <line x1="810" y1="30" x2="810" y2="310" stroke="#21262d" stroke-width="1.5"/>

  <!-- ═══════════════════════════════════════════════════
       RIGHT COLUMN  x: 810–1200  (ticket lifecycle)
       ═══════════════════════════════════════════════════ -->

  <!-- Header -->
  <text x="830" y="68" fill="#484f58" font-family="monospace" font-size="9" letter-spacing="2">TICKET LIFECYCLE</text>

  <!-- Phase boxes: x=830 w=350 (right edge x=1180) -->

  <!-- brainstorm: y=80 h=40 -->
  <rect x="830" y="80" width="350" height="40" rx="5" fill="#161b22" stroke="#21262d" stroke-width="1"/>
  <circle cx="850" cy="100" r="5" fill="#58a6ff" opacity="0.75"/>
  <text x="866" y="96"  fill="#8b949e" font-family="monospace" font-size="10" font-weight="600">brainstorm</text>
  <text x="866" y="111" fill="#30363d" font-family="monospace" font-size="9">spec · human approval gate</text>

  <!-- connector -->
  <line x1="850" y1="120" x2="850" y2="130" stroke="#21262d" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- plan: y=130 h=40 -->
  <rect x="830" y="130" width="350" height="40" rx="5" fill="#161b22" stroke="#21262d" stroke-width="1"/>
  <circle cx="850" cy="150" r="5" fill="#58a6ff" opacity="0.75"/>
  <text x="866" y="146" fill="#8b949e" font-family="monospace" font-size="10" font-weight="600">plan</text>
  <text x="866" y="161" fill="#30363d" font-family="monospace" font-size="9">ordered tasks · human approval gate</text>

  <!-- connector -->
  <line x1="850" y1="170" x2="850" y2="180" stroke="#21262d" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- implement: y=180 h=40 — active, green border -->
  <rect x="830" y="180" width="350" height="40" rx="5" fill="#0d2010" stroke="#238636" stroke-width="1"/>
  <circle cx="850" cy="200" r="5" fill="#3fb950"/>
  <text x="866" y="196" fill="#3fb950" font-family="monospace" font-size="10" font-weight="600">implement</text>
  <text x="866" y="211" fill="#4e9a60" font-family="monospace" font-size="9">claude code · observer · gate</text>

  <!-- connector -->
  <line x1="850" y1="220" x2="850" y2="230" stroke="#21262d" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- review: y=230 h=40 -->
  <rect x="830" y="230" width="350" height="40" rx="5" fill="#161b22" stroke="#21262d" stroke-width="1"/>
  <circle cx="850" cy="250" r="5" fill="#d29922" opacity="0.8"/>
  <text x="866" y="246" fill="#8b949e" font-family="monospace" font-size="10" font-weight="600">review</text>
  <text x="866" y="261" fill="#30363d" font-family="monospace" font-size="9">full attestation · soul promotion</text>

  <!-- Bottom tagline -->
  <text x="600" y="324" text-anchor="middle" fill="#21262d" font-family="monospace" font-size="9" letter-spacing="1">golem build .. golem</text>
</svg>
