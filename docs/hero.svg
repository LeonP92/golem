<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <linearGradient id="node-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e2936"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="subtle-glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="340" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g opacity="0.04" stroke="#58a6ff" stroke-width="0.5">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="340"/>
    <line x1="400" y1="0" x2="400" y2="340"/>
    <line x1="600" y1="0" x2="600" y2="340"/>
    <line x1="800" y1="0" x2="800" y2="340"/>
    <line x1="1000" y1="0" x2="1000" y2="340"/>
  </g>

  <!-- Diagram: orchestrator node (left) -->
  <g transform="translate(80, 110)">
    <rect width="140" height="60" rx="8" fill="url(#node-grad)" stroke="#30363d" stroke-width="1"/>
    <rect width="140" height="3" rx="1.5" fill="url(#accent)" opacity="0.9"/>
    <text x="70" y="28" text-anchor="middle" fill="#e6edf3" font-family="monospace" font-size="11" font-weight="600">orchestrator</text>
    <text x="70" y="46" text-anchor="middle" fill="#6e7681" font-family="monospace" font-size="9">dashboard · tickets · SSE</text>
  </g>

  <!-- Arrows from orchestrator to shems -->
  <g stroke="url(#accent)" stroke-width="1.5" opacity="0.6" filter="url(#subtle-glow)">
    <!-- to shem-a -->
    <line x1="220" y1="128" x2="310" y2="98" stroke-dasharray="4,3"/>
    <polygon points="310,98 302,104 307,94" fill="#7c3aed" opacity="0.8"/>
    <!-- to shem-b -->
    <line x1="220" y1="140" x2="310" y2="140"/>
    <polygon points="310,140 302,136 302,144" fill="#2563eb" opacity="0.8"/>
    <!-- to shem-c -->
    <line x1="220" y1="152" x2="310" y2="182" stroke-dasharray="4,3"/>
    <polygon points="310,182 302,176 307,186" fill="#7c3aed" opacity="0.8"/>
  </g>

  <!-- Shem nodes -->
  <g transform="translate(310, 68)">
    <rect width="110" height="50" rx="7" fill="url(#node-grad)" stroke="#30363d" stroke-width="1"/>
    <text x="55" y="22" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="9">shem-a</text>
    <text x="55" y="38" text-anchor="middle" fill="#3fb950" font-family="monospace" font-size="9">● implement</text>
  </g>
  <g transform="translate(310, 115)">
    <rect width="110" height="50" rx="7" fill="url(#node-grad)" stroke="#30363d" stroke-width="1"/>
    <text x="55" y="22" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="9">shem-b</text>
    <text x="55" y="38" text-anchor="middle" fill="#d29922" font-family="monospace" font-size="9">● review</text>
  </g>
  <g transform="translate(310, 162)">
    <rect width="110" height="50" rx="7" fill="url(#node-grad)" stroke="#30363d" stroke-width="1"/>
    <text x="55" y="22" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="9">shem-c</text>
    <text x="55" y="38" text-anchor="middle" fill="#58a6ff" font-family="monospace" font-size="9">● brainstorm</text>
  </g>

  <!-- Divider line -->
  <line x1="470" y1="40" x2="470" y2="300" stroke="#21262d" stroke-width="1.5"/>

  <!-- Main wordmark -->
  <text x="600" y="162" text-anchor="middle"
        fill="url(#accent)"
        font-family="'SF Mono', 'Fira Code', monospace"
        font-size="96"
        font-weight="700"
        letter-spacing="-3"
        filter="url(#glow)">golem</text>

  <!-- Tagline -->
  <text x="600" y="200" text-anchor="middle"
        fill="#6e7681"
        font-family="'SF Mono', 'Fira Code', monospace"
        font-size="13"
        letter-spacing="2">workflow orchestration for AI coding agents</text>

  <!-- Divider right -->
  <line x1="740" y1="40" x2="740" y2="300" stroke="#21262d" stroke-width="1.5"/>

  <!-- Right panel: ticket lifecycle -->
  <g transform="translate(760, 60)">
    <text x="0" y="0" fill="#6e7681" font-family="monospace" font-size="10" letter-spacing="1">TICKET LIFECYCLE</text>

    <!-- Phase steps -->
    <g transform="translate(0, 20)">
      <!-- brainstorm -->
      <rect width="340" height="36" rx="5" fill="#161b22" stroke="#21262d" stroke-width="1"/>
      <circle cx="18" cy="18" r="5" fill="#58a6ff" opacity="0.8"/>
      <text x="32" y="14" fill="#8b949e" font-family="monospace" font-size="10">brainstorm</text>
      <text x="32" y="27" fill="#30363d" font-family="monospace" font-size="9">spec · human approval</text>

      <!-- plan -->
      <rect y="44" width="340" height="36" rx="5" fill="#161b22" stroke="#21262d" stroke-width="1"/>
      <circle cx="18" cy="62" r="5" fill="#58a6ff" opacity="0.8"/>
      <text x="32" y="58" fill="#8b949e" font-family="monospace" font-size="10">plan</text>
      <text x="32" y="71" fill="#30363d" font-family="monospace" font-size="9">tasks · human approval</text>

      <!-- implement -->
      <rect y="88" width="340" height="36" rx="5" fill="#0d1117" stroke="#238636" stroke-width="1"/>
      <circle cx="18" cy="106" r="5" fill="#3fb950"/>
      <text x="32" y="102" fill="#3fb950" font-family="monospace" font-size="10">implement</text>
      <text x="32" y="115" fill="#6e7681" font-family="monospace" font-size="9">claude code · observer · gate</text>

      <!-- review -->
      <rect y="132" width="340" height="36" rx="5" fill="#161b22" stroke="#21262d" stroke-width="1"/>
      <circle cx="18" cy="150" r="5" fill="#d29922" opacity="0.8"/>
      <text x="32" y="146" fill="#8b949e" font-family="monospace" font-size="10">review</text>
      <text x="32" y="159" fill="#30363d" font-family="monospace" font-size="9">full attestation · soul promotion</text>

      <!-- connector dots -->
      <line x1="18" y1="23" x2="18" y2="44" stroke="#21262d" stroke-width="1" stroke-dasharray="2,2"/>
      <line x1="18" y1="67" x2="18" y2="88" stroke="#21262d" stroke-width="1" stroke-dasharray="2,2"/>
      <line x1="18" y1="111" x2="18" y2="132" stroke="#21262d" stroke-width="1" stroke-dasharray="2,2"/>
    </g>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="320" width="1200" height="20" fill="#0d1117" opacity="0.7"/>
  <text x="600" y="334" text-anchor="middle" fill="#30363d" font-family="monospace" font-size="9" letter-spacing="1">golem build .. golem</text>
</svg>
