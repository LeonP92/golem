services:
  orchestrator:
    build:
      context: .
      target: orchestrator
    ports:
      # Host side only. Set GOLEM_PORT in .env when something else on the
      # machine already holds 8080 — that is the only port that can clash,
      # because nothing competes for one inside the container network.
      #
      # The container side stays 8080 deliberately, and GOLEM_PORT is NOT in
      # the environment block below. If the orchestrator process moved with
      # it, the healthcheck (which probes localhost:8080 from inside) would
      # fail forever and compose would never start the shem, which reaches
      # the orchestrator at orchestrator:8080 from deploy/shem.yaml.
      - "${GOLEM_PORT:-8080}:8080"
    volumes:
      - orchestrator-data:/data
      - ./deploy/orchestrator.yaml:/etc/golem/orchestrator.yaml:ro
    environment:
      - ORCHESTRATOR_DB=/data/orchestrator.db
      # Auto-provision admin user on startup. Override with GOLEM_ADMIN_USERNAME.
      # No default: "admin" is 5 characters and the account creation requires
      # 8, so the old fallback could only ever produce an orchestrator nobody
      # could sign in to. Failing here names the problem instead.
      - GOLEM_ADMIN_PASSWORD=${GOLEM_ADMIN_PASSWORD:?set GOLEM_ADMIN_PASSWORD in .env (8+ characters)}
      - GOLEM_ADMIN_USERNAME=${GOLEM_ADMIN_USERNAME:-admin}
      # Auto-register the shem. Override with GOLEM_SHEM_NAME.
      - GOLEM_SHEM_API_KEY=${GOLEM_SHEM_API_KEY:-changeme-set-golem-shem-api-key-in-env}
      - GOLEM_SHEM_NAME=${GOLEM_SHEM_NAME:-default}
      # GitHub Issues sync. Named by github.token_env in orchestrator.yaml.
      # Empty is a supported state: the orchestrator serves normally and only
      # logs an ERROR once a repository has actually been enabled. There is no
      # env_file here on purpose — .env also holds the Claude credentials, and
      # only the two variables below belong in a container.
      - GOLEM_GITHUB_TOKEN=${GOLEM_GITHUB_TOKEN:-}
      # Empty is the same as unset here: config.TriggerLabel trims and ignores
      # a blank value, falling back to github.default_label and then "golem".
      - GOLEM_GITHUB_LABEL=${GOLEM_GITHUB_LABEL:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # Initialises the local test repo that the shem works on.
  # Runs once; subsequent starts are no-ops because the volume persists.
  repo-init:
    build:
      context: .
      target: shem
    volumes:
      - test-repo:/repos/test
    environment:
      - GIT_AUTHOR_NAME=Golem
      - GIT_AUTHOR_EMAIL=golem@local
      - GIT_COMMITTER_NAME=Golem
      - GIT_COMMITTER_EMAIL=golem@local
    entrypoint: ["sh", "-c"]
    command:
      - |
        if [ -f /repos/test/.git/HEAD ]; then
          echo "test repo already initialised"
          exit 0
        fi
        git init /repos/test
        cd /repos/test
        golem init --backend claude-code
        git add -A
        git commit -m "init: golem test repo"
        echo "test repo ready"
    restart: "no"

  shem:
    build:
      context: .
      target: shem
    # golem-shem runs as PID 1, and PID 1 inherits every orphaned process in
    # the namespace. The agent spawns claude, which spawns git, npm, hooks and
    # their own children; whenever one of those outlives its parent it is
    # reparented here. Go's os/exec only reaps the children it started, so the
    # rest stayed as zombies — 77 of them accumulated in a little over two
    # hours of real ticket work, all PPID 1, STAT Z. Enough of them exhausts
    # the PID limit and the container can no longer fork at all.
    #
    # init: true puts Docker's tini in front of golem-shem to do the reaping.
    # Preferred over a reaper inside golem-shem: PID-1 duties are the
    # supervisor's job, tini is already in the engine, and the same binary run
    # outside a container (CLI mode, `go run`) is then not PID 1 and needs
    # none of it.
    init: true
    depends_on:
      orchestrator:
        condition: service_healthy
      repo-init:
        condition: service_completed_successfully
    volumes:
      - ./deploy/shem.yaml:/etc/golem/shem.yaml:ro
      # Test repo the shem works on by default.
      # Every repository Golem clones for itself lives here. Without it a
      # repo named in shem.yaml but not mounted — which is every repo an
      # operator adds — landed in the container's own writable layer, so the
      # clone, the .golem ticket state and the worktrees were all discarded on
      # the next container recreate and the whole repository cloned again.
      # The two more specific mounts below still win over this one.
      - shem-repos:/repos
      - test-repo:/repos/test
      # Optional: mount a real repo (e.g. your project) for real tickets.
      # Set GOLEM_REPO_PATH to the absolute path on the host.
      - ${GOLEM_REPO_PATH:-.}:/repos/golem
      # ── Auth mode: session (option A) ──────────────────────────────────────
      # Mount your host ~/.claude so the shem reuses your desktop Claude Code
      # session. No ANTHROPIC_API_KEY needed.
      #   Windows: CLAUDE_HOME=C:\Users\you\.claude
      #   Mac/Linux: CLAUDE_HOME=$HOME/.claude
      # Leave CLAUDE_HOME unset to use a throwaway volume (OAuth-token/API-key
      # modes only).
      - ${CLAUDE_HOME:-shem-claude}:/root/.claude
    environment:
      # ── Auth mode: OAuth token (option B) ───────────────────────────────────
      # Set CLAUDE_CODE_OAUTH_TOKEN in .env (generated via `claude setup-token`)
      # and leave CLAUDE_HOME unset. Same headless bootstrap as API-key mode.
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
      # ── Auth mode: API key (option C) ───────────────────────────────────────
      # Set ANTHROPIC_API_KEY in .env and leave CLAUDE_HOME unset.
      # The entrypoint bootstraps a headless Claude Code config automatically.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Must match what the orchestrator was started with.
      - GOLEM_SHEM_API_KEY=${GOLEM_SHEM_API_KEY:-changeme-set-golem-shem-api-key-in-env}
      - GOLEM_SHEM_NAME=${GOLEM_SHEM_NAME:-default}
      # Push credential for the ticket branch a pull request is opened from.
      # The entrypoint installs it as an HTTPS git credential helper for
      # github.com when it is set, and only then.
      #
      # Deliberately NOT ${GOLEM_GITHUB_TOKEN}. This container runs the agent
      # on text a stranger wrote, and the shipped deploy/shem.yaml sets
      # no_push: true, so by default there is nothing here for a credential to
      # do. Shipping the orchestrator's repo-write PAT in anyway would widen
      # what a successful prompt injection gets its hands on for no benefit.
      # Set GOLEM_SHEM_GITHUB_TOKEN in .env at the same time you turn no_push
      # off — ideally to a second, push-only token rather than the same one.
      - GOLEM_GITHUB_TOKEN=${GOLEM_SHEM_GITHUB_TOKEN:-}

volumes:
  orchestrator-data:
  test-repo:
  shem-repos:    # repositories golem clones on demand (see the shem's /repos)
  shem-claude:   # fallback volume when CLAUDE_HOME is not set
